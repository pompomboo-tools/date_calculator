<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- ステータスバーの色をアプリ最上部の背景色に合わせる -->
  <meta name="theme-color" content="#eef3fd">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <title>日付計算ツール</title>
  <style>
@charset "UTF-8";

:root {
  --system-bg: #f2f2f7;
  --card-bg: rgba(255, 255, 255, 0.82);
  --card-border: rgba(255, 255, 255, 0.6);
  --group-bg: rgba(118, 118, 128, 0.08);
  --text-primary: #1c1c1e;
  --text-secondary: #8e8e93;
  --accent-color: #007aff;
  --accent-hover: #0062cc;
  --accent-subtle: rgba(0, 122, 255, 0.08);
  --accent-border: rgba(0, 122, 255, 0.18);
  --border-color: rgba(60, 60, 67, 0.12);
  --input-bg: rgba(255, 255, 255, 0.9);
  --shadow-card: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-segmented: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0, 0, 0, 0.04);
  --radius-xl: 20px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Hiragino Sans", "Yu Gothic UI", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  background-color: var(--system-bg);
  background-image: radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.05) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(0, 122, 255, 0.05) 0px, transparent 50%);
  background-attachment: fixed;
}

html,
body {
  width: 100%;
  max-width: 100%;
  margin: 0;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  min-height: -webkit-fill-available;
  font-family: var(--font-family);
  color: var(--text-primary);
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

main {
  width: min(640px, 100%);
  min-width: 0;
  margin: 0 auto;
}

/* インフォメーションボタンの設置エリア（右上に変更） */
.header-container {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  margin-bottom: 12px;
}

/* インフォメーションボタン（単体「i」、背景色: 白、クリアと同色テキスト） */
.info-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: #ffffff;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  padding: 0;
  cursor: pointer;
  outline: none;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;
  font-weight: 400;
  font-style: normal;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s ease;
}

.info-button:hover {
  background: rgba(118, 118, 128, 0.08);
  border-color: #c7c7cc;
  color: var(--text-primary);
}

.info-button:active {
  transform: scale(0.98);
}

/* iOS風 モーダルダイアログ */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
  padding: 20px;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  position: relative;
  background: #ffffff;
  border-radius: 20px;
  max-width: 90vw;
  max-height: 85vh;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transform: scale(0.92);
  transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.modal-overlay.active .modal-content {
  transform: scale(1);
}

.modal-close-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(118, 118, 128, 0.12);
  color: var(--text-secondary);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: background 0.15s ease, transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.modal-close-btn:active {
  transform: scale(0.9);
  background: rgba(118, 118, 128, 0.25);
}

.modal-close-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
}

.modal-body {
  padding: 16px;
  overflow-y: auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal-body img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  display: block;
}

/* メインカード */
.card {
  width: 100%;
  min-width: 0;
  background: var(--card-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: clamp(14px, 3vw, 20px);
}

/* iOS風セグメンテッドコントロール */
.calc-mode-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  background: var(--group-bg);
  padding: 3px;
  border-radius: var(--radius-md);
  margin-bottom: 10px;
}

.mode-tab {
  min-height: 36px;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  border-radius: calc(var(--radius-md) - 3px);
  font-weight: 600;
  font-size: 0.88rem;
  letter-spacing: -0.01em;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
}

.mode-tab:hover {
  color: var(--text-primary);
}

.mode-tab.active {
  background: #ffffff;
  color: var(--text-primary);
  box-shadow: var(--shadow-segmented);
}

/* パラメーター入力エリア（グループコンテナ） */
.params-group {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  margin: 0 0 10px 0;
  background: rgba(255, 255, 255, 0.4);
}

.field {
  margin-bottom: 8px;
}

.field-mb-0 {
  margin-bottom: 0;
}

.input-row {
  display: grid;
  grid-template-columns: minmax(100px, 1fr) minmax(100px, 0.9fr) minmax(140px, 1.2fr);
  gap: 12px;
  align-items: start;
  margin-bottom: 8px;
}

.input-row .field {
  margin-bottom: 0;
}

label,
legend {
  display: block;
  font-weight: 600;
  margin-bottom: 3px;
  font-size: 0.8rem;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  text-transform: uppercase;
}

input[type="text"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  min-width: 0;
  max-width: 100%;
  min-height: 42px;
  height: 42px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 0 12px;
  font: inherit;
  font-size: 16px;
  color: var(--text-primary);
  background: var(--input-bg);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  -webkit-appearance: none;
  appearance: none;
}

input:focus,
select:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 3.5px rgba(0, 122, 255, 0.2);
}

fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}

/* セグメントラジオボタン */
.radio-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  background: var(--group-bg);
  padding: 3px;
  border-radius: var(--radius-md);
}

.radio-option {
  position: relative;
  border: none;
  border-radius: calc(var(--radius-md) - 3px);
  min-height: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--text-secondary);
  background: transparent;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.radio-option:has(input:checked) {
  background: #ffffff;
  color: var(--text-primary);
  box-shadow: var(--shadow-segmented);
}

.radio-option:has(input:disabled) {
  opacity: 0.4;
  cursor: not-allowed;
}

.radio-option input {
  position: absolute;
  opacity: 0;
}

button {
  border: 0;
  border-radius: var(--radius-md);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

button:active {
  transform: scale(0.98);
}

.quick-settings {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 10px 0;
}

.quick-button {
  min-width: 0;
  min-height: 38px;
  height: 38px;
  padding: 0 12px;
  font-size: 0.88rem;
  background: var(--group-bg);
  color: var(--accent-color);
  border: none;
  border-radius: var(--radius-md);
}

.quick-button:hover {
  background: rgba(0, 122, 255, 0.12);
}

.action-buttons {
  display: grid;
  grid-template-columns: minmax(88px, 0.35fr) minmax(0, 1fr);
  gap: 10px;
}

.clear {
  min-height: 44px;
  height: 44px;
  background: var(--group-bg);
  color: var(--text-primary);
  font-size: 0.95rem;
}

.clear:hover {
  background: rgba(118, 118, 128, 0.18);
}

.calculate {
  width: 100%;
  min-height: 44px;
  height: 44px;
  background: var(--accent-color);
  color: #ffffff;
  font-size: 0.98rem;
  box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
}

.calculate:hover {
  background: var(--accent-hover);
}

/* 結果表示エリア */
.result {
  margin-top: 10px;
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  background: var(--accent-subtle);
  border: 1px solid var(--accent-border);
  text-align: center;
}

.result-label {
  color: var(--text-primary);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.result-date {
  font-size: clamp(1.25rem, 3.5vw, 1.6rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.25;
}

.result-description {
  margin: 4px 0 0;
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.note {
  margin: 10px 0 0;
  padding-top: 8px;
  border-top: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 0.75rem;
  line-height: 1.35;
  text-align: center;
}

.error {
  color: #ff3b30;
  font-size: 0.75rem;
  margin-top: 2px;
  min-height: 1.1em;
}

/* カレンダーアイコン入力 */
.desktop-date-input {
  display: flex;
  gap: 8px;
  align-items: center;
}

.desktop-date-input input[type="text"] {
  flex: 1;
}

.desktop-date-input input[type="date"] {
  position: relative;
  width: 42px;
  min-width: 42px;
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-color);
  transition: all 0.15s ease;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');
  background-repeat: no-repeat;
  background-position: center;
  background-size: 18px 18px;
}

.desktop-date-input input[type="date"]:hover {
  background-color: var(--accent-subtle);
  border-color: var(--accent-color);
}

.desktop-date-input input[type="date"]::-webkit-datetime-edit {
  display: none;
}

.desktop-date-input input[type="date"]::-webkit-calendar-picker-indicator {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  cursor: pointer;
  opacity: 0;
}

.mobile-date-pickers {
  display: none;
}

/* レスポンシブ */
@media (max-width: 580px) {
  body {
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    padding-left: calc(8px + env(safe-area-inset-left));
    padding-right: calc(8px + env(safe-area-inset-right));
  }

  .header-container {
    margin-bottom: 8px;
  }

  .card {
    padding: 12px;
    border-radius: var(--radius-lg);
  }

  .desktop-date-input {
    display: none;
  }

  .mobile-date-pickers {
    display: grid;
    grid-template-columns: 1.35fr 0.85fr 0.85fr;
    gap: 6px;
  }

  .mobile-date-pickers .picker-field > label {
    display: none;
  }

  input[type="text"],
  input[type="number"],
  input[type="date"],
  select,
  .picker-field select {
    font-size: 16px !important;
    width: 100%;
    height: 40px;
    padding: 0 6px;
    border-radius: var(--radius-md);
    background: var(--input-bg);
    font-weight: 600;
    text-align: center;
  }

  .input-row {
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 8px;
  }

  .quick-settings {
    gap: 8px;
    margin: 8px 0;
  }

  .clear, .calculate {
    height: 42px;
    font-size: 16px;
  }

  .result {
    padding: 10px;
  }
}

:root {
  --system-bg: #f2f2f7;
  --card-bg: #ffffff;
  --card-border: transparent;
  --group-bg: rgba(118, 118, 128, 0.12);
  --text-primary: #1c1c1e;
  --text-secondary: #636366;
  --accent-color: #007aff;
  --accent-hover: #0062cc;
  --border-color: #d1d1d6;
  --input-bg: #ffffff;
  --shadow-card: 0 6px 20px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --radius-xl: 16px;
  --radius-lg: 14px;
  --radius-md: 11px;
}
html { background: var(--system-bg); background-image: none; }
body {
  padding: max(22px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
main { width: min(640px, 100%); }
.card {
  background: var(--card-bg);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: 0;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: 22px;
}
.calc-mode-selector {
  gap: 6px;
  padding: 5px;

  border-radius: 14px;
}

.mode-tab.active { color: var(--accent-color); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.params-group { background: #f9f9fb; border-color: #e5e5ea; padding: 16px; margin-bottom: 14px; }
input[type="text"], input[type="number"], input[type="date"], select {
  min-height: 46px; height: 46px; border-color: var(--border-color); border-radius: 11px;
}
.radio-group { padding: 5px; border-radius: 11px; }
.radio-option { min-height: 38px; height: 38px; border-radius: 8px; }
.quick-settings { margin: 12px 0; }
.quick-button { min-height: 42px; height: 42px; color: var(--accent-color); background: var(--group-bg); }
.action-buttons { grid-template-columns: 1fr 3fr; gap: 10px; }
.clear, .calculate { min-height: 50px; height: 50px; border-radius: 13px; }
.clear {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  font-size: 15px;
  font-weight: 500;
}
.calculate { font-size: 16px; font-weight: 700; box-shadow: none; }
.result { margin-top: 14px; border-radius: 14px; }
@media (hover: hover) and (pointer: fine) {
  .mode-tab:hover { background: rgba(255,255,255,.72); color: var(--accent-color); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .mode-tab.active:hover { background: #fff; color: var(--accent-color); box-shadow: 0 2px 7px rgba(0,0,0,.14); }
  .clear:hover { background: rgba(118,118,128,.08); border-color:#c7c7cc; color:var(--text-primary); box-shadow:none; }

  .quick-button:hover { background: rgba(0,122,255,.12); }
  .radio-option:hover:not(:has(input:disabled)) { background: rgba(255,255,255,.7); color: var(--text-primary); }
  .radio-option:has(input:disabled):hover { opacity:.55; background:rgba(118,118,128,.08); }
  .info-button:hover { background: rgba(118, 118, 128, 0.08); border-color: #c7c7cc; color: var(--text-primary); }
}
button:focus-visible, input:focus-visible, select:focus-visible, .radio-option:has(input:focus-visible) {

@media (max-width: 580px) {

  }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

<body>
  <main>
    <div class="header-container">
      <button type="button" class="info-button" id="infoButton" aria-label="インフォメーション">i</button>
    </div>

    <section class="card" aria-label="日付計算ツール">
      
      <!-- モード切替タブ -->
      <div class="calc-mode-selector">
        <button type="button" class="mode-tab active" data-mode="add">日付を加算・減算</button>
        <button type="button" class="mode-tab" data-mode="diff">2日の期間を計算</button>
      </div>

      <form id="dateForm" novalidate>
        <fieldset class="params-group">
          <!-- 基準日 / 開始日 -->
          <div class="field base-date-field">
            <label id="baseDateLabel" for="baseDate">基準日</label>
            <div class="desktop-date-input">
              <input id="baseDate" type="text" inputmode="numeric" autocomplete="off" placeholder="例：2026-08-10" aria-describedby="baseDateError" required>
              <input id="baseDatePicker" type="date" aria-label="カレンダーから日付を選択">
            </div>
            <div id="mobileDatePickers" class="mobile-date-pickers" aria-label="基準日を年月日で設定">
              <div class="picker-field">
                <label for="yearPicker">年</label>
                <select id="yearPicker" aria-label="年"></select>
              </div>
              <div class="picker-field">
                <label for="monthPicker">月</label>
                <select id="monthPicker" aria-label="月"></select>
              </div>
              <div class="picker-field">
                <label for="dayPicker">日</label>
                <select id="dayPicker" aria-label="日"></select>
              </div>
            </div>
            <div id="baseDateError" class="error" role="alert"></div>
          </div>

          <!-- 終了日 (期間計算モード時のみ表示) -->
          <div id="endDateContainer" class="field base-date-field mode-diff-only" style="display: none;">
            <label for="endDate">終了日</label>
            <div class="desktop-date-input">
              <input id="endDate" type="text" inputmode="numeric" autocomplete="off" placeholder="例：2026-08-10" aria-describedby="endDateError">
              <input id="endDatePicker" type="date" aria-label="カレンダーから日付を選択">
            </div>
            <div id="mobileEndPickers" class="mobile-date-pickers" aria-label="終了日を年月日で設定">
              <div class="picker-field">
                <label for="endYearPicker">年</label>
                <select id="endYearPicker" aria-label="終了年"></select>
              </div>
              <div class="picker-field">
                <label for="endMonthPicker">月</label>
                <select id="endMonthPicker" aria-label="終了月"></select>
              </div>
              <div class="picker-field">
                <label for="endDayPicker">日</label>
                <select id="endDayPicker" aria-label="終了日"></select>
              </div>
            </div>
            <div id="endDateError" class="error" role="alert"></div>
          </div>

          <!-- 加減算入力グループ (加減算モード時のみ表示) -->
          <div id="addModeInputs" class="input-row mode-add-only">
            <div class="field">
              <label for="amount">数値</label>
              <input id="amount" type="number" min="0" step="1" inputmode="numeric" required>
              <div id="amountError" class="error" role="alert"></div>
            </div>
            <div class="field">
              <label for="unit">単位</label>
              <select id="unit">
                <option value="day">日</option>
                <option value="week">週間</option>
                <option value="month">カ月</option>
                <option value="year">年</option>
              </select>
            </div>
            <fieldset class="field">
              <legend>方向</legend>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="direction" value="past" checked>前
                </label>
                <label class="radio-option">
                  <input type="radio" name="direction" value="future">後
                </label>
              </div>
            </fieldset>
          </div>

          <!-- 初日指定 -->
          <div class="field field-mb-0">
            <fieldset>
              <legend>初日</legend>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="firstDay" value="exclude" checked>含めない
                </label>
                <label class="radio-option">
                  <input type="radio" name="firstDay" value="include">含める
                </label>
              </div>
            </fieldset>
          </div>
        </fieldset>

        <!-- クイック設定ボタン (加減算モード時のみ表示) -->
        <div id="quickSettings" class="quick-settings mode-add-only" aria-label="便利な設定">
          <button class="quick-button" type="button" data-amount="45" data-unit="day">45日前</button>
          <button class="quick-button" type="button" data-amount="3" data-unit="month">3カ月前</button>
        </div>

        <div class="action-buttons">
          <button class="clear" id="clearButton" type="button">クリア</button>
          <button class="calculate" type="submit">計算する</button>
        </div>
      </form>

      <section class="result" aria-live="polite">
        <div class="result-label">計算結果</div>
        <div id="resultDate" class="result-date">－</div>
        <div id="resultDescription" class="result-description">条件を入力してください</div>
      </section>

      <p class="note">※月・年の計算で同じ日が存在しない場合は、その月の末日とする。</p>
    </section>
  </main>

  <!-- iOS風 モーダルダイアログ構造 -->
  <div class="modal-overlay" id="infoModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="閉じる">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-body">
        <img src="pompomboo-tools.png" alt="Pompomboo Tools">
      </div>
    </div>
  </div>

  <script>
'use strict';

const form = document.getElementById('dateForm');
const baseDateInput = document.getElementById('baseDate');
const baseDatePicker = document.getElementById('baseDatePicker');
const baseDateError = document.getElementById('baseDateError');

const endDateInput = document.getElementById('endDate');
const endDatePicker = document.getElementById('endDatePicker');
const endDateError = document.getElementById('endDateError');

const amountInput = document.getElementById('amount');
const unitInput = document.getElementById('unit');
const amountError = document.getElementById('amountError');
const resultDate = document.getElementById('resultDate');
const resultDescription = document.getElementById('resultDescription');

const yearPicker = document.getElementById('yearPicker');
const monthPicker = document.getElementById('monthPicker');
const dayPicker = document.getElementById('dayPicker');

const endYearPicker = document.getElementById('endYearPicker');
const endMonthPicker = document.getElementById('endMonthPicker');
const endDayPicker = document.getElementById('endDayPicker');

const clearButton = document.getElementById('clearButton');
const firstDayInputs = document.querySelectorAll('input[name="firstDay"]');

/* インフォメーションモーダル制御 */
const infoButton = document.getElementById('infoButton');
const infoModal = document.getElementById('infoModal');
const modalCloseBtn = document.getElementById('modalCloseBtn');

function openModal() {
  infoModal.classList.add('active');
  infoModal.setAttribute('aria-hidden', 'false');
}

function closeModal() {
  infoModal.classList.remove('active');
  infoModal.setAttribute('aria-hidden', 'true');
}

infoButton.addEventListener('click', openModal);
modalCloseBtn.addEventListener('click', closeModal);

infoModal.addEventListener('click', (e) => {
  if (e.target === infoModal) {
    closeModal();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && infoModal.classList.contains('active')) {
    closeModal();
  }
});

let currentMode = 'add';

const labels = { day: '日', week: '週間', month: 'カ月', year: '年' };
const weekdays = ['日', '月', '火', '水', '木', '金', '土'];

const pad = n => String(n).padStart(2, '0');
const inputDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function updateFirstDayState() {
  const isDay = currentMode === 'diff' || unitInput.value === 'day';
  firstDayInputs.forEach(input => {
    input.disabled = !isDay;
  });
}

function parseDate(v) {
  if (!v) return null;
  const match = v.trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!match) return null;
  const y = Number(match[1]);
  const m = Number(match[2]);
  const d = Number(match[3]);
  const date = new Date(y, m - 1, d, 12);
  return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d ? date : null;
}

const format = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;

function daysInMonth(y, m) {
  return new Date(y, m, 0, 12).getDate();
}

function addOption(select, value, label) {
  const option = document.createElement('option');
  option.value = value;
  option.textContent = label;
  select.appendChild(option);
}

function buildMobilePickers() {
  for (let y = 1900; y <= 2100; y++) {
    addOption(yearPicker, y, `${y}年`);
    addOption(endYearPicker, y, `${y}年`);
  }
  for (let m = 1; m <= 12; m++) {
    addOption(monthPicker, m, `${m}月`);
    addOption(endMonthPicker, m, `${m}月`);
  }
  syncPickersFromText();
  syncEndPickersFromText();
}

function rebuildDays(selectedDay) {
  const y = Number(yearPicker.value);
  const m = Number(monthPicker.value);
  const last = daysInMonth(y, m);
  dayPicker.replaceChildren();
  for (let d = 1; d <= last; d++) addOption(dayPicker, d, `${d}日`);
  dayPicker.value = Math.min(Number(selectedDay) || 1, last);
}

function rebuildEndDays(selectedDay) {
  const y = Number(endYearPicker.value);
  const m = Number(endMonthPicker.value);
  const last = daysInMonth(y, m);
  endDayPicker.replaceChildren();
  for (let d = 1; d <= last; d++) addOption(endDayPicker, d, `${d}日`);
  endDayPicker.value = Math.min(Number(selectedDay) || 1, last);
}

function syncPickersFromText() {
  const d = parseDate(baseDateInput.value) || new Date();
  const formattedDate = inputDate(d);
  yearPicker.value = d.getFullYear();
  monthPicker.value = d.getMonth() + 1;
  rebuildDays(d.getDate());
  baseDatePicker.value = formattedDate;
}

function syncEndPickersFromText() {
  const d = parseDate(endDateInput.value) || new Date();
  const formattedDate = inputDate(d);
  endYearPicker.value = d.getFullYear();
  endMonthPicker.value = d.getMonth() + 1;
  rebuildEndDays(d.getDate());
  endDatePicker.value = formattedDate;
}

function updateDateFromPickers() {
  const previousDay = Number(dayPicker.value) || 1;
  rebuildDays(previousDay);
  const formattedDate = `${yearPicker.value}-${pad(monthPicker.value)}-${pad(dayPicker.value)}`;
  baseDateInput.value = formattedDate;
  baseDatePicker.value = formattedDate;
  baseDateError.textContent = '';
}

function updateEndDateFromPickers() {
  const previousDay = Number(endDayPicker.value) || 1;
  rebuildEndDays(previousDay);
  const formattedDate = `${endYearPicker.value}-${pad(endMonthPicker.value)}-${pad(endDayPicker.value)}`;
  endDateInput.value = formattedDate;
  endDatePicker.value = formattedDate;
  endDateError.textContent = '';
}

function addMonths(d, m) {
  const r = new Date(d);
  const day = r.getDate();
  r.setDate(1);
  r.setMonth(r.getMonth() + m);
  const last = new Date(r.getFullYear(), r.getMonth() + 1, 0, 12).getDate();
  r.setDate(Math.min(day, last));
  return r;
}

function calculateAdd(base, n, unit, sign, includeFirstDay) {
  const r = new Date(base);
  if (unit === 'day') {
    let days = n;
    if (includeFirstDay && n > 0) {
      days = n - 1;
    }
    r.setDate(r.getDate() + sign * days);
  }
  if (unit === 'week') r.setDate(r.getDate() + sign * n * 7);
  if (unit === 'month') return addMonths(r, sign * n);
  if (unit === 'year') return addMonths(r, sign * n * 12);
  return r;
}

function calculateDiff(d1, d2, includeFirstDay) {
  const start = d1 < d2 ? d1 : d2;
  const end = d1 < d2 ? d2 : d1;
  
  const diffTime = Math.abs(end.getTime() - start.getTime());
  let diffDays = Math.round(diffTime / (1000 * 3600 * 24));
  if (includeFirstDay) {
    diffDays += 1;
  }

  const weeks = Math.floor(diffDays / 7);
  const remDays = diffDays % 7;

  let yDiff = end.getFullYear() - start.getFullYear();
  let mDiff = end.getMonth() - start.getMonth();
  let dayDiff = end.getDate() - start.getDate();

  if (dayDiff < 0) {
    mDiff--;
    const prevMonthLastDay = daysInMonth(end.getFullYear(), end.getMonth());
    dayDiff += prevMonthLastDay;
  }
  if (mDiff < 0) {
    yDiff--;
    mDiff += 12;
  }

  const totalMonths = yDiff * 12 + mDiff;

  const yearsDate = new Date(start);
  yearsDate.setFullYear(yearsDate.getFullYear() + yDiff);
  let remDaysY = Math.round((end.getTime() - yearsDate.getTime()) / (1000 * 3600 * 24));
  if (includeFirstDay && yDiff === 0) {
    remDaysY = diffDays;
  } else if (includeFirstDay) {
    remDaysY += 1;
  }

  return {
    days: diffDays,
    weeks: weeks,
    remDays: remDays,
    years: yDiff,
    months: mDiff,
    remDaysYMD: dayDiff,
    totalMonths: totalMonths,
    remDaysY: remDaysY
  };
}

function showResult() {
  baseDateError.textContent = '';
  amountError.textContent = '';
  endDateError.textContent = '';

  const base = parseDate(baseDateInput.value);

  if (!base) {
    baseDateError.textContent = baseDateInput.value.trim() === '' ? '基準日を入力してください。' : '実在する日付をYYYY-MM-DD形式で入力してください。';
    resultDate.textContent = '－';
    resultDescription.textContent = '入力内容を確認してください';
    return;
  }

  if (currentMode === 'add') {
    const value = amountInput.value.trim();
    const n = Number(value);

    if (value === '' || !Number.isInteger(n) || n < 0) {
      amountError.textContent = value === '' ? '数値を入力してください。' : '0以上の整数を入力してください。';
      resultDate.textContent = '－';
      resultDescription.textContent = '入力内容を確認してください';
      return;
    }

    const direction = document.querySelector('input[name="direction"]:checked').value;
    const firstDayVal = document.querySelector('input[name="firstDay"]:checked').value;
    const includeFirstDay = (unitInput.value === 'day' && firstDayVal === 'include');
    const sign = direction === 'past' ? -1 : 1;
    const answer = calculateAdd(base, n, unitInput.value, sign, includeFirstDay);

    resultDate.textContent = format(answer);
    resultDescription.textContent = `${format(base)}の${n}${labels[unitInput.value]}${direction === 'past' ? '前' : '後'}${includeFirstDay ? '（初日含める）' : ''}`;
  } else {
    const end = parseDate(endDateInput.value);
    if (!end) {
      endDateError.textContent = endDateInput.value.trim() === '' ? '終了日を入力してください。' : '実在する日付をYYYY-MM-DD形式で入力してください。';
      resultDate.textContent = '－';
      resultDescription.textContent = '入力内容を確認してください';
      return;
    }

    const firstDayVal = document.querySelector('input[name="firstDay"]:checked').value;
    const includeFirstDay = (firstDayVal === 'include');
    const diff = calculateDiff(base, end, includeFirstDay);

    resultDate.textContent = `${diff.days.toLocaleString()} 日間`;
    
    let desc = `（${diff.weeks} 週 ${diff.remDays} 日 / ${diff.totalMonths} カ月 ${diff.remDaysYMD} 日 / ${diff.years} 年 ${diff.remDaysY} 日 / ${diff.years} 年 ${diff.months} カ月 ${diff.remDaysYMD} 日）${includeFirstDay ? ' ※初日含む' : ''}`;

    resultDescription.textContent = desc;
  }
}

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', (e) => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentMode = e.target.dataset.mode;

    const baseLabel = document.getElementById('baseDateLabel');
    if (currentMode === 'add') {
      baseLabel.textContent = '基準日';
      document.querySelectorAll('.mode-add-only').forEach(el => el.style.display = '');
      document.querySelectorAll('.mode-diff-only').forEach(el => el.style.display = 'none');
    } else {
      baseLabel.textContent = '開始日';
      document.querySelectorAll('.mode-add-only').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.mode-diff-only').forEach(el => el.style.display = 'block');
      if (!endDateInput.value) {
        endDateInput.value = inputDate(new Date());
        endDatePicker.value = endDateInput.value;
      }
      syncEndPickersFromText();
    }
    updateFirstDayState();
    resultDate.textContent = '－';
    resultDescription.textContent = '条件を入力してください';
  });
});

unitInput.addEventListener('change', () => {
  updateFirstDayState();
});

document.querySelectorAll('.quick-button').forEach(button => button.addEventListener('click', () => {
  amountInput.value = button.dataset.amount;
  unitInput.value = button.dataset.unit;
  updateFirstDayState();
  document.querySelector('input[name="direction"][value="past"]').checked = true;
  showResult();
}));

form.addEventListener('submit', e => {
  e.preventDefault();
  showResult();
});

clearButton.addEventListener('click', () => {
  const todayStr = inputDate(new Date());
  
  if (currentMode === 'add') {
    baseDateInput.value = todayStr;
    baseDatePicker.value = todayStr;
    syncPickersFromText();
    amountInput.value = '';
    unitInput.value = 'day';
    document.querySelector('input[name="direction"][value="past"]').checked = true;
    document.querySelector('input[name="firstDay"][value="exclude"]').checked = true;
    baseDateError.textContent = '';
    amountError.textContent = '';
  } else {
    baseDateInput.value = todayStr;
    baseDatePicker.value = todayStr;
    endDateInput.value = todayStr;
    endDatePicker.value = todayStr;
    syncPickersFromText();
    syncEndPickersFromText();
    document.querySelector('input[name="firstDay"][value="exclude"]').checked = true;
    baseDateError.textContent = '';
    endDateError.textContent = '';
  }
  
  updateFirstDayState();
  resultDate.textContent = '－';
  resultDescription.textContent = '条件を入力してください';
});

yearPicker.addEventListener('change', updateDateFromPickers);
monthPicker.addEventListener('change', updateDateFromPickers);
dayPicker.addEventListener('change', updateDateFromPickers);

endYearPicker.addEventListener('change', updateEndDateFromPickers);
endMonthPicker.addEventListener('change', updateEndDateFromPickers);
endDayPicker.addEventListener('change', updateEndDateFromPickers);

baseDatePicker.addEventListener('change', e => {
  if (e.target.value) {
    baseDateInput.value = e.target.value;
    syncPickersFromText();
    baseDateError.textContent = '';
  }
});

endDatePicker.addEventListener('change', e => {
  if (e.target.value) {
    endDateInput.value = e.target.value;
    syncEndPickersFromText();
    endDateError.textContent = '';
  }
});

baseDatePicker.addEventListener('click', e => {
  if (typeof e.target.showPicker === 'function') {
    try { e.target.showPicker(); } catch (err) {}
  }
});

endDatePicker.addEventListener('click', e => {
  if (typeof e.target.showPicker === 'function') {
    try { e.target.showPicker(); } catch (err) {}
  }
});

baseDateInput.addEventListener('change', syncPickersFromText);
endDateInput.addEventListener('change', syncEndPickersFromText);

const today = inputDate(new Date());
baseDateInput.value = today;
baseDatePicker.value = today;
endDateInput.value = today;
endDatePicker.value = today;
buildMobilePickers();
updateFirstDayState();
resultDate.textContent = '－';
resultDescription.textContent = '条件を入力してください';
baseDateError.textContent = '';
amountError.textContent = '';
endDateError.textContent = '';

// ダブルタップによるズーム動作を無効化
let lastTouchEnd = 0;
document.addEventListener('touchend', (event) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

// 2本指でのピンチズーム（拡大・縮小）動作を無効化
document.addEventListener('touchstart', (event) => {
  if (event.touches.length > 1) {
    event.preventDefault();
  }
}, { passive: false });

// Safari/iOSのジェスチャー（ピンチイン・アウト）を無効化
document.addEventListener('gesturestart', (event) => {
  event.preventDefault();
});
  </script>
</body>
</html>
